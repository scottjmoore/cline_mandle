# Repository settings
---
repository: cline_mandle
description: Mandelbrot Console Explorer - Interactive terminal viewer for the Mandelbrot set
branch: main
license: MIT

github_actions: true  # Enable GitHub Actions

workflows:
  - name: Test suite
    run_tests: true
    test_dir: build

repository_settings:
  auto_merge: false
  allow_squash_merge: true

To push to GitHub, run:
  git remote add origin https://github.com/YOUR_USERNAME/cline_mandle.git
  git branch -M main
  git push -u origin main --force
